<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 · 沉潜·Bedrock</title>
<meta http-equiv="refresh" content="0; url=./index.html">
<style>
  body{background:#FFFDF0;background-image:radial-gradient(#000 1.6px,transparent 1.7px);background-size:20px 20px;
       font-family:'Archivo Black','Noto Sans SC',system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}
  .box{background:#fff;border:3px solid #000;box-shadow:8px 8px 0 0 #000;padding:32px;text-align:center}
  a{display:inline-block;margin-top:14px;border:3px solid #000;background:#A3E635;box-shadow:4px 4px 0 0 #000;padding:.5rem 1rem;color:#000;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:64px">404</div>
  <div style="font-size:18px;margin-top:8px">页面不存在，正在跳回首页…</div>
  <a href="./index.html">立即返回</a>
</div>
<script>
  // 记住来路，跳回首页后由 index.html 恢复路由
  try {
    var rest = location.pathname.replace(/404\.html$/, '');
    sessionStorage.setItem('bedrock_404', rest + location.search + location.hash);
  } catch (e) {}
  var m = location.pathname.match(/^(.*\/)404\.html$/);
  location.replace((m ? m[1] : './') + 'index.html');
</script>
</body>
</html>
